    <div id="toast" class="toast">訊息</div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global State
        window.State = {
            currentUser: null,
            isGuest: true,
            entries: [],
            links: [],
            tags: [],
            users: [],
            system: null,
            searchQuery: '',
            selectedDate: null,
            currentCalendarDate: new Date()
        };

        // UI Utilities
        window.UI = {
            showToast: (msg, isError = false) => {
                const toast = document.getElementById('toast');
                toast.textContent = msg;
                toast.className = `toast show ${isError ? 'error' : ''}`;
                setTimeout(() => toast.className = 'toast', 3000);
            },
            openModal: (id) => {
                document.getElementById(id).classList.add('active');
                if(id === 'entry-modal' && !document.getElementById('entry-id').value) {
                    document.getElementById('entry-date').value = new Date().toISOString().split('T')[0];
                }
            },
            closeModal: (id) => {
                document.getElementById(id).classList.remove('active');
                if(id === 'entry-modal') document.getElementById('entry-form').reset();
                if(id === 'login-modal') document.getElementById('login-form').reset();
                if(id === 'tag-modal') document.getElementById('tag-form').reset();
                if(id === 'user-modal') document.getElementById('user-form').reset();
                if(id === 'link-modal') document.getElementById('link-form').reset();
                document.getElementById('entry-id').value = '';
            },
            escapeHtml: (unsafe) => {
                return (unsafe || '').toString()
                     .replace(/&/g, "&amp;")
                     .replace(/</g, "&lt;")
                     .replace(/>/g, "&gt;")
                     .replace(/"/g, "&quot;")
                     .replace(/'/g, "&#039;");
            },
            formatDateTime: (timestamp) => {
                if (!timestamp) return '--/--/-- --:--';
                const d = new Date(timestamp);
                const pad = (n) => String(n).padStart(2, '0');
                return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            }
        };

        // =========================================================
        // ⚠️ 第 1 步：請將以下內容替換為您從 Firebase 後台取得的 Config ⚠️
        // =========================================================
     const firebaseConfig = {
  apiKey: "AIzaSyB6NgZNLvexXfKwkW5eP4tNnkSHwuY8KyM",
  authDomain: "contactbook-c6d95.firebaseapp.com",
  projectId: "contactbook-c6d95",
  storageBucket: "contactbook-c6d95.firebasestorage.app",
  messagingSenderId: "655576113880",
  appId: "1:655576113880:web:15606f5cad291d8aca6dad"
};
        // =========================================================

        let app, auth, db;
        let useMockDB = false;
        
        try {
            // 檢查是否有填寫 apiKey，若無則使用本機模擬模式 (Local Storage)
            if (!firebaseConfig.apiKey || firebaseConfig.apiKey === "您的 API KEY") {
                useMockDB = true;
                console.log("⚠️ 未檢測到有效的 Firebase 金鑰，已啟用【本機模擬資料庫模式】");
            } else {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                console.log("✅ Firebase 初始化成功！");
            }
        } catch (e) {
            useMockDB = true;
            console.error("Firebase 初始化發生錯誤，已切換回本機模擬模式:", e);
        }

        // 本機模擬資料庫 (讓介面在無雲端庫狀態下仍可操作)
        const LocalDB = {
            data: JSON.parse(localStorage.getItem('mock_school_db')) || { entries: [], links: [], tags: [], users: [], system: [] },
            listeners: {},
            save: function() { localStorage.setItem('mock_school_db', JSON.stringify(this.data)); },
            trigger: function(col) { if(this.listeners[col]) this.listeners[col]({ docs: this.data[col].map(d => ({ id: d.id, data: () => d })) }); },
            add: async function(col, docData) { 
                const id = Math.random().toString(36).substr(2, 9);
                this.data[col].push({ id, ...docData });
                this.save(); this.trigger(col);
                return { id };
            },
            update: async function(col, id, docData) {
                const idx = this.data[col].findIndex(d => d.id === id);
                if(idx > -1) { this.data[col][idx] = { ...this.data[col][idx], ...docData }; this.save(); this.trigger(col); }
            },
            delete: async function(col, id) {
                this.data[col] = this.data[col].filter(d => d.id !== id);
                this.save(); this.trigger(col);
            }
        };

        // 資料庫 API 封裝 (自動判斷要用 Firebase 還是 LocalDB)
        window.API = {
            onSnapshot: (colName, cb) => {
                if (useMockDB) {
                    LocalDB.listeners[colName] = cb;
                    setTimeout(() => LocalDB.trigger(colName), 0);
                } else {
                    // 已修正為標準的 Firebase 根目錄結構 (不再使用沙盒專屬結構)
                    onSnapshot(collection(db, colName), cb, (err) => console.error("Firestore 讀取錯誤:", err));
                }
            },
            addDoc: async (colName, data) => {
                if (useMockDB) return LocalDB.add(colName, data);
                else return addDoc(collection(db, colName), data);
            },
            updateDoc: async (colName, id, data) => {
                if (useMockDB) return LocalDB.update(colName, id, data);
                else return updateDoc(doc(db, colName, id), data);
            },
            deleteDoc: async (colName, id) => {
                if (useMockDB) return LocalDB.delete(colName, id);
                else return deleteDoc(doc(db, colName, id));
            }
        };

        // Authentication & User Management
        window.Auth = {
            init: async () => {
                if (!useMockDB) {
                    try { 
                        // 需要在 Firebase 後台開啟 "匿名登入"
                        await signInAnonymously(auth); 
                    } catch (e) { 
                        console.error("Firebase 匿名登入失敗，請確認是否於後台啟用匿名登入功能", e); 
                    }
                }
                
                // 檢查登入狀態

                const acc = document.getElementById('login-username').value;
                const pass = document.getElementById('login-password').value;
                
                // 保底管理員帳號：若資料庫尚未建置任何帳號時使用
                if (State.users.length === 0 && acc === 'admin' && pass === 'admin') {
                    State.currentUser = { id: 'admin-1', account: 'admin', role: 'admin', name: '系統管理員' };
                    State.isGuest = false;
                    sessionStorage.setItem('school_app_session', JSON.stringify(State.currentUser));
                    UI.closeModal('login-modal');
                    UI.showToast(`歡迎回來，系統管理員`);
                    Auth.updateUI();
                    App.renderEntries();
                    return;

                // 比對帳號密碼
                const user = State.users.find(u => u.account === acc && u.password === pass);
                if (user) {
                    State.currentUser = { id: user.id, account: user.account, role: user.role, name: user.name };
                    State.isGuest = false;
                    sessionStorage.setItem('school_app_session', JSON.stringify(State.currentUser));
                    UI.closeModal('login-modal');
                    UI.showToast(`歡迎回來，${user.name}`);

            deleteUser: async (id) => {

        // Main App Logic
        window.App = {
            init: () => {
                document.getElementById('btn-login-modal').addEventListener('click', () => UI.openModal('login-modal'));
                document.getElementById('btn-logout').addEventListener('click', Auth.logout);

                const textarea = document.getElementById('entry-content');
                const insertText = `【${tagName}】`;
                const startPos = textarea.selectionStart;
                const endPos = textarea.selectionEnd;
                const text = textarea.value;
                textarea.value = text.substring(0, startPos) + insertText + text.substring(endPos);
                textarea.selectionStart = startPos + insertText.length;
                textarea.selectionEnd = startPos + insertText.length;
                textarea.focus();
            },
            
            saveEntry: async () => {
                if (State.isGuest) return;
                
                const id = document.getElementById('entry-id').value;
                const date = document.getElementById('entry-date').value;
                const content = document.getElementById('entry-content').value;
                
                // 自動解析內容中包含哪些標籤，存入資料庫以供未來搜尋或篩選使用
                const selectedTags = State.tags
                    .filter(t => content.includes(`【${t.name}】`))
                    .map(t => t.id);

                const data = {
                    date, content, tags: selectedTags,
                    authorId: State.currentUser.id,
                    authorName: State.currentUser.name,
                    timestamp: new Date().getTime()
                };

                try {
                    if (id) {
                        await API.updateDoc('entries', id, data);
                        UI.showToast("更新成功");
                    } else {
                        await API.addDoc('entries', data);
                        UI.showToast("新增成功");
                    }
                    UI.closeModal('entry-modal');
                } catch (e) {
                    UI.showToast("儲存失敗", true);
                }

                document.getElementById('entry-date').value = entry.date;

            deleteEntry: async (id) => {

            renderSystem: () => {

                const titleEl = document.getElementById('main-system-title');

                if (newTitle && newTitle.trim() !== "") {
                    API.updateDoc('system', State.system.id, { title: newTitle.trim() });

                }

            renderEntries: () => {
                const container = document.getElementById('entries-container');
                let filtered = [...State.entries];

                // Sort by date desc, then timestamp
                filtered.sort((a, b) => {
                    if (a.date !== b.date) return new Date(b.date) - new Date(a.date);
                    return b.timestamp - a.timestamp;
                });

                // Apply Search Filter
                if (State.searchQuery) {
                    const q = State.searchQuery.toLowerCase();
                    filtered = filtered.filter(e => 
                        (e.title && e.title.toLowerCase().includes(q)) || 
                        e.content.toLowerCase().includes(q)
                    );
                }

                // Apply Date Filter
                if (State.selectedDate) {
                    filtered = filtered.filter(e => e.date === State.selectedDate);
                    const filterText = document.getElementById('current-filter-text');
                    filterText.textContent = `篩選日期：${State.selectedDate}`;
                    filterText.classList.remove('hidden');
                    document.getElementById('btn-clear-filter').classList.remove('hidden');
                } else {
                    const filterText = document.getElementById('current-filter-text');
                    filterText.textContent = State.searchQuery ? `搜尋結果` : `顯示全部`;
                    if(State.searchQuery) filterText.classList.remove('hidden');
                    else filterText.classList.add('hidden');
                    document.getElementById('btn-clear-filter').classList.add('hidden');
                }

                let latestTimestamp = 0;
                if (State.entries.length > 0) {
                    latestTimestamp = Math.max(...State.entries.map(e => e.timestamp || 0));
                }
                document.getElementById('last-updated-text').textContent = latestTimestamp ? UI.formatDateTime(latestTimestamp) : '--/--/-- --:--';

                if (filtered.length === 0) {
                    container.innerHTML = `<div class="text-center py-10 text-gray-400">沒有符合的聯絡簿資料</div>`;
                    return;
                }

                container.innerHTML = filtered.map(entry => {
                    // Check permissions
                    const canEdit = !State.isGuest && (State.currentUser.role === 'admin' || State.currentUser.id === entry.authorId);

                    // 安全地處理文字與換行
                    let formattedContent = UI.escapeHtml(entry.content).replace(/\n/g, '<br>');
                    
                    // 動態將內容中的【標籤】替換為彩色 Badge
                    State.tags.forEach(t => {
                        const safeTagName = UI.escapeHtml(t.name);
                        const badgeHtml = `<span class="tag-badge whitespace-nowrap mx-1 relative -top-[1px]" style="background-color: ${t.color}">${safeTagName}</span>`;
                        // 使用全域替換 (正則表達式)
                        const regex = new RegExp(`【${safeTagName}】`, 'g');
                        formattedContent = formattedContent.replace(regex, badgeHtml);
                    });
                    
                    // 處理舊資料相容性 (如果原本有標籤但沒打在文字裡的，預設顯示在最前方)
                    let legacyTagsHtml = '';
                    (entry.tags || []).forEach(tagId => {
                        const t = State.tags.find(x => x.id === tagId);
                        if(t && !entry.content.includes(`【${t.name}】`)) {
                            legacyTagsHtml += `<span class="tag-badge whitespace-nowrap mr-1 relative -top-[1px]" style="background-color: ${t.color}">${UI.escapeHtml(t.name)}</span>`;
                        }
                    });

                    return `
                        <article class="bg-white p-5 rounded-lg shadow-sm border border-gray-100 flex flex-col gap-3 relative overflow-hidden group">
                            <!-- left accent border -->
                            <div class="absolute left-0 top-0 bottom-0 w-1 bg-matcha opacity-50"></div>

                                </div>
                                ` : ''}
                            </div>
                            
                            <div class="text-gray-700 leading-relaxed bg-washi p-4 rounded text-[15px] japanese-border mt-1">
                                ${legacyTagsHtml}${formattedContent}

                            <div class="text-right text-xs text-gray-400">
                                發布者: ${UI.escapeHtml(entry.authorName)}
                            </div>
                        </article>
                    `;

                // 取得今天日期 (避免時區問題，使用當地時間組合)
                const d = new Date();
                const todayStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                
                // 過濾已過期的連結 (管理員仍可看到，用以維護刪除)

                    return true;

                if(visibleLinks.length === 0) {
                    container.innerHTML = `<div class="text-sm text-gray-400">目前沒有文件或網站</div>`;

                // Sort by timestamp desc
                const sorted = [...visibleLinks].sort((a,b) => b.timestamp - a.timestamp);

                        <div class="flex items-center justify-between p-3 border rounded hover:shadow-md transition ${isExpired ? 'bg-gray-100 opacity-60' : 'bg-washi'} group">

                                </div>
                            </button>

                        <td class="p-2">
                            <span class="px-2 py-1 rounded text-xs ${u.role === 'admin' ? 'bg-wood text-white' : 'bg-gray-200'}">
                                ${u.role === 'admin' ? '管理員' : '協作者'}
                            </span>
                        </td>
                        <td class="p-2 text-right">
                            <button onclick="Auth.deleteUser('${u.id}')" class="text-sakura hover:text-sakura-dark text-sm"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            }
        };

        // Calendar Component
        window.Calendar = {
            render: () => {
                const date = State.currentCalendarDate;
                const year = date.getFullYear();
                const month = date.getMonth();
                
                document.getElementById('calendar-month').textContent = `${year}年 ${month + 1}月`;
                
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const today = new Date();
                
                const grid = document.getElementById('calendar-grid');
                let html = '';
                
                // Empty cells before first day
                for (let i = 0; i < firstDay; i++) {
                    html += `<div class="p-2"></div>`;
                }
                
                // Days
                for (let i = 1; i <= daysInMonth; i++) {
                    const cellDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                    
                    const isToday = i === today.getDate() && month === today.getMonth() && year === today.getFullYear();
                    const isSelected = State.selectedDate === cellDateStr;
                    
                    // Check if entry exists for this date
                    const hasEntry = State.entries.some(e => e.date === cellDateStr);
                    
                    let classes = `p-2 rounded cursor-pointer transition relative hover:bg-matcha hover:text-white `;
                    if (isSelected) classes += `bg-matcha text-white font-bold `;
                    else if (isToday) classes += `bg-washi border border-matcha text-matcha font-bold `;
                    else classes += `text-gray-700 `;

                    html += `
                        <div class="${classes}" onclick="Calendar.selectDate('${cellDateStr}')">
                            ${i}
                            ${hasEntry ? `<div class="absolute bottom-0.5 left-1/2 transform -translate-x-1/2 w-1 h-1 bg-matcha rounded-full ${isSelected||isToday ? 'bg-white' : ''}"></div>` : ''}
                        </div>
                    `;
                }
                grid.innerHTML = html;
            },
            prevMonth: () => {
                State.currentCalendarDate.setMonth(State.currentCalendarDate.getMonth() - 1);
                Calendar.render();
            },
            nextMonth: () => {
                State.currentCalendarDate.setMonth(State.currentCalendarDate.getMonth() + 1);
                Calendar.render();
            },
            selectDate: (dateStr) => {
                if(State.selectedDate === dateStr) {
                    State.selectedDate = null; // toggle off
                } else {
                    State.selectedDate = dateStr;
                }
                App.renderEntries();
                Calendar.render(); // update selected state
            }
        };

        // Bootstrap Application
        document.addEventListener('DOMContentLoaded', () => {
            Auth.init().then(() => {
                App.init();
                Calendar.render();
            });
        });

    </script>
</body>
</html>
